# Nightly full-database backup → Cloudflare R2.
#
# INERT UNTIL DEPLOY DAY: this workflow only runs once it is on the default
# branch AND the repository secrets below exist. No secrets → the job fails
# fast in the validate step without ever reaching a database.
#
# Required repository secrets:
#   BACKUP_DATABASE_URL          privileged (owner/admin) Neon connection URI
#   R2_BACKUP_ACCESS_KEY_ID      R2 token (bucket-scoped)
#   R2_BACKUP_SECRET_ACCESS_KEY
#   R2_BACKUP_BUCKET             private bucket name, e.g. educbt-backups
#   R2_BACKUP_ACCOUNT_ID         Cloudflare account id (endpoint is derived)
#
# Required repository variables (Settings → Secrets and variables → Actions):
#   PG_MAJOR                    PostgreSQL major version of production
#                               (must match, so pg_dump's format matches)

name: nightly-backup

on:
  schedule:
    # 01:00 UTC = 02:00 West Africa Time — off-peak, hours before school
    # starts in Nigeria. Backups are also manually dispatchable for a
    # pre-deployment snapshot.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # pg_dump major version must match the server. Ubuntu ships old client
      # packages, so use the official PostgreSQL apt repository.
      - name: Install postgresql-client-${{ vars.PG_MAJOR || '17' }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-${{ vars.PG_MAJOR || '17' }}

      - name: Install dependencies
        run: npm ci

      - name: Backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
          BACKUP_RETENTION_DAYS: '30'
        run: npm run backup:db

      # A failed backup must be visible. The script itself exits non-zero on
      # any failure; the summary makes the run readable in the Actions log.
      - name: Job summary
        if: always()
        run: |
          echo "## Nightly backup" >> $GITHUB_STEP_SUMMARY
          echo "Exit status of the backup step determines the run result." >> $GITHUB_STEP_SUMMARY
